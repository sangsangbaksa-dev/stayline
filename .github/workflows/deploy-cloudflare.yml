# Deploys this app to its existing Cloudflare Pages project (stayline-family). Runs only from the
# Actions tab (workflow_dispatch) until the App-Multi workflow is retired. Needs repository
# secrets CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID; without
# them the deploy step is skipped.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.js
      - name: Build
        run: node scripts/build-pages.js
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=stayline-family --branch=main --commit-dirty=true
      - name: Note when skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
